name: Daily Options Report Update

on:
  schedule:
    - cron: "15 21 * * 1-5"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run daily update
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/daily_update.py

      - name: Run leaders report
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/generate_leaders_report.py

      - name: Save OI history snapshots (오늘의 주도주 기준)
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/snapshot_oi_history.py

      - name: Commit updated report
        run: |
          git config user.name "options-board-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/watchlist_report.json
          git add public/leaders_report.json
          git add public/oi_history/
          git diff --cached --quiet || git commit -m "chore: daily options report update $(date -u +%Y-%m-%d)"
          git push