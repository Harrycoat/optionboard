name: Intraday Options Report Update
on:
  schedule:
    # 장중 스냅샷용 — 블로그 포스팅은 하지 않고 대시보드 데이터(리포트)만 갱신한다.
    # 블로그 포스팅(감마 요약/종목 딥다이브)은 daily-update.yml 이 장마감 후 하루 1번만 그대로 담당한다.
    #
    # UTC 30분에 13,15,17,19시 실행 → 서머타임(EDT, UTC-4) 기준 ET 9:30 / 11:30 / 13:30 / 15:30 에 해당.
    # 서머타임이 아닌 기간(EST, UTC-5)에는 실제로 ET 8:30 / 10:30 / 12:30 / 14:30 으로 1시간씩 당겨져서 돈다.
    # (GitHub Actions cron은 UTC 고정이라 서머타임 전환을 자동으로 따라가지 못함 — 11월 초에 재조정 필요)
    - cron: "30 13,15,17,19 * * 1-5"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Run daily update
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/daily_update.py
      - name: Run leaders report
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/generate_leaders_report.py
      - name: Save OI history snapshots (오늘의 주도주 기준)
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/snapshot_oi_history.py
      - name: Commit updated report
        run: |
          git config user.name "options-board-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/watchlist_report.json
          git add public/leaders_report.json
          git add public/oi_history/
          git diff --cached --quiet || git commit -m "chore: intraday options report update $(date -u +%Y-%m-%dT%H:%M)"
          git push
