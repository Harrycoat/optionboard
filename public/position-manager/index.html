<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GEX Manager">
  <title>GEX Position Manager</title>
  <link rel="manifest" href="/position-manager/manifest.webmanifest">
  <link rel="stylesheet" href="/position-manager/styles.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div>
      <div class="eyebrow">GEXOPTION</div>
      <h1>Position Manager</h1>
      <p>TOS에서 매수 · 휴대폰에서 관리</p>
    </div>
    <button id="addBtn" class="icon-add" aria-label="포지션 추가">＋</button>
  </header>

  <main>
    <section class="summary">
      <div><span>등록</span><strong id="count">0 / 20</strong></div>
      <div><span>관리 필요</span><strong id="actionCount">0</strong></div>
      <div><span>시세</span><strong id="mode">SCHWAB</strong></div>
    </section>

    <section id="cards" class="cards"></section>

    <div id="empty" class="empty">
      <div class="empty-icon">＋</div>
      <strong>포지션을 추가하세요</strong>
      <span>Ticker · 수량 · 매입가 · Call/Put Wall</span>
    </div>
  </main>

  <button id="fabBtn" class="fab" aria-label="포지션 추가">＋</button>
</div>

<dialog id="positionDialog">
<form id="positionForm">
  <div class="sheet-handle"></div>
  <h2>포지션 추가</h2>
  <label>Ticker<input id="ticker" maxlength="10" required placeholder="PLTR" autocapitalize="characters"></label>
  <div class="two-col">
    <label>Shares<input id="shares" type="number" min="1" step="1" required placeholder="200" inputmode="numeric"></label>
    <label>Average Price<input id="avgPrice" type="number" min="0.01" step="0.01" required placeholder="165.00" inputmode="decimal"></label>
  </div>
  <div class="two-col">
    <label>Call Wall<input id="callWall" type="number" min="0.01" step="0.01" required placeholder="180" inputmode="decimal"></label>
    <label>Put Wall<input id="putWall" type="number" min="0.01" step="0.01" required placeholder="170" inputmode="decimal"></label>
  </div>
  <div class="checks">
    <label class="check"><input id="hasCC" type="checkbox"> Covered Call</label>
    <label class="check"><input id="hasPut" type="checkbox"> Protective Put</label>
    <label class="check"><input id="hasCSP" type="checkbox"> CSP</label>
  </div>
  <div class="dialog-actions">
    <button type="button" id="cancelBtn">취소</button>
    <button class="primary" type="submit">저장</button>
  </div>
</form>
</dialog>

<script type="module" src="/position-manager/app.js"></script>
</body>
</html>
