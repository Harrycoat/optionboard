<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEXOption · TOP 100 SWING WATCH</title><style>
:root{color-scheme:dark;--bg:#08111e;--panel:#14233a;--text:#eef6ff;--sub:#a8b9ca;--border:#34465f;--gold:#f4c75c;--green:#55ddb3}
*{box-sizing:border-box}body{background:var(--bg);color:var(--text);margin:0;font:15px system-ui,Arial,sans-serif}main{max-width:900px;margin:auto;padding:16px}

.item{display:grid;grid-template-columns:35px 90px 1fr auto;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}.item:last-child{border:0}.rank{color:var(--sub)}.sym{font-size:18px;font-weight:800}.sector{font-size:12px;color:var(--sub)}.percent{color:var(--green);font-weight:700;font-size:12px}.negative{color:#ff9c9c}
button{background:var(--gold);color:#10151e;border:0;border-radius:8px;padding:12px;font-weight:800;cursor:pointer}button:disabled{opacity:.45}.watch{color:var(--green);font-weight:800}.excluded{color:#ffb5a7}.btn{display:inline-block;background:var(--gold);color:#15151c;font-size:12px;text-decoration:none;border-radius:8px;padding:10px 11px;font-weight:800;text-align:center}

</style></head><body><main>

<h1>TOP 100 · SWING WATCH</h1>
<p class="muted">2026-10-09 사용자 업로드 Barchart Weighted Alpha TOP 100 고정 목록 · 52주 수익률 별도 표시. TOP 100은 매수 신호가 아닙니다. 강세 종목을 먼저 분류한 뒤, 각 종목 차트에서 일봉 매도 둔화·Hull20 눌림·Put Wall·30분봉 진입을 직접 검증합니다.</p>
<section class="panel"><div class="controls"><input id="q" placeholder="종목 검색 (예: INTC, MU)" autocomplete="off" aria-label="종목 검색"><select id="sector" aria-label="산업 선택"><option value="">전체 산업</option></select></div><p id="status" class="muted"></p><div class="controls"><button id="scan" type="button">TOP 100 눌림목 스캔 (완료 일봉)</button><select id="filter"><option value="all">전체 TOP 100 · 30분 Hull20 근접순</option><option value="watch">일봉 눌림 WATCH만</option><option value="ready">30분 ENTRY만</option></select></div><p id="scan-status" class="muted">스캔 전에는 기존 TOP 100 목록이 표시됩니다. 버튼을 눌러 확인하세요.</p></section>
<section class="panel" id="list"></section>
<script>
'use strict';
const raw="TXG,Medical,598.21\nSNDK,Technology,1136.41\nIOVA,Medical,561.87\nEDRY,Transportation,380.85\nERAS,Medical,535.71\nLITE,Technology,596.77\nTWST,Medical,408.33\nBUUU,Technology,419.21\nMU,Technology,433.38\nCDNA,Medical,331.30\nMRNA,Medical,683.87\nASX,Technology,292.23\nTJGC,Business Services,524.43\nPSIG,Transportation,43.01\nATEX,Technology,275.50\nHPE,Technology,174.00\nAXTI,Technology,1217.30\nDELL,Technology,269.01\nECO,Transportation,220.36\nPBF,Energy,190.88\nCOHU,Technology,229.82\nCLMT,Energy,211.28\nFET,Energy,225.84\nSAIH,Business Services,153.68\nMRVL,Technology,199.25\nRNG,Technology,185.36\nCORT,Medical,36.76\nPXS,Transportation,168.94\nPENG,Technology,232.89\nUMC,Technology,206.22\nLIND,Consumer Discretionary,193.55\nVLO,Energy,172.36\nSYRE,Medical,301.23\nILMN,Medical,180.54\nMXL,Technology,504.51\nSTX,Technology,252.17\nAP,Materials,295.71\nMPC,Energy,145.62\nFORM,Technology,268.99\nSILC,Technology,221.70\nINSW,Transportation,172.72\nVICR,Technology,406.77\nDRTS,Medical,273.13\nORKA,Medical,220.14\nOKTA,Technology,143.33\nSLS,Medical,513.72\nSMTC,Technology,164.01\nAMD,Technology,161.63\nSIF,Aerospace,221.28\nNAT,Transportation,161.16\nGRAL,Medical,97.67\nDINO,Energy,133.65\nFOSL,Retail,188.57\nGLBS,Transportation,201.72\nVIAV,Technology,258.29\nETON,Medical,171.06\nTOP,Finance,126.96\nTWLO,Technology,152.72\nKRT,Industrials,125.52\nFRO,Transportation,146.06\nPARR,Energy,135.96\nCRWD,Technology,113.49\nPLSE,Medical,172.21\nNTRA,Medical,131.56\nSSL,Energy,157.80\nMANE,Medical,\nCHRN,Technology,258.24\nDK,Energy,118.92\nTEN,Transportation,142.79\nANDG,Finance,\nTER,Technology,177.71\nVSTS,Industrials,180.76\nRLAY,Medical,166.52\nPSX,Energy,115.42\nGORO,Materials,317.29\nLPG,Transportation,113.78\nPRLD,Medical,182.14\nCIEN,Technology,168.88\nFTNT,Technology,124.21\nINTC,Technology,178.88\nLCUT,Consumer Discretionary,156.85\nMATX,Transportation,140.65\nPKOH,Materials,144.57\nIRDM,Technology,139.22\nMRX,Finance,131.44\nVSXY,Retail,178.24\nPANW,Technology,92.75\nCLYM,Medical,486.77\nHAE,Medical,136.29\nENGS,Consumer Discretionary,-55.52\nLFST,Medical,131.06\nWDC,Technology,229.18\nIMOS,Technology,269.41\nCMBT,Transportation,128.58\nFTRE,Medical,90.19\nPBR,Energy,113.59\nNTAP,Technology,94.31\nPGEN,Medical,142.79\nOPHC,Finance,115.57\nDHX,Technology,119.35";
const rows=raw.split('\n').map((line,i)=>{const [symbol,sector,year]=line.split(',');return {rank:i+1,symbol,sector,year:year===''?null:Number(year)}});
const cats=[...new Set(rows.map(x=>x.sector))].sort();
const sel=document.getElementById('sector'),q=document.getElementById('q'),list=document.getElementById('list'),status=document.getElementById('status');
const scanBtn=document.getElementById('scan'),scanStatus=document.getElementById('scan-status'),filter=document.getElementById('filter');
let snapshots=new Map(),signals=new Map(),scanned=false,failures=[];
for(const cat of cats){const opt=document.createElement('option');opt.value=cat;opt.textContent=cat;sel.append(opt)}
function render(){
 const search=q.value.trim().toUpperCase(),sector=sel.value;
 let matches=rows.filter(x=>(!search||x.symbol.includes(search))&&(!sector||x.sector===sector));
 if(scanned&&filter.value==='watch')matches=matches.filter(x=>snapshots.get(x.symbol)?.watch_candidate===true);
 if(scanned&&filter.value==='ready')matches=matches.filter(x=>snapshots.get(x.symbol)?.watch_candidate===true&&signals.get(x.symbol)?.ready===true);
 if(scanned)matches.sort((a,b)=>{
   const sa=signals.get(a.symbol),sb=signals.get(b.symbol);
   const da=Number.isFinite(sa?.hull_distance_pct)?Math.abs(sa.hull_distance_pct):Infinity;
   const db=Number.isFinite(sb?.hull_distance_pct)?Math.abs(sb.hull_distance_pct):Infinity;
   return da-db || a.rank-b.rank;
 });
 status.textContent=matches.length+' / 100 종목 · '+(scanned?'30분봉 Hull20 거리 절댓값 가까운 순 · 미조회 맨 아래':'원본 순위')+' · 15분 지연 · 2026-10-09 TOP 100';
 list.replaceChildren();
 if(!matches.length){list.textContent='이 필터에는 해당 종목이 없습니다. 전체 TOP 100 필터로 다시 확인하세요.';return;}
 for(const x of matches){
  const stat=snapshots.get(x.symbol),signal=signals.get(x.symbol),line=document.createElement('div');line.className='item';
  const rank=document.createElement('span');rank.className='rank';rank.textContent='#'+x.rank;
  const symbol=document.createElement('span');symbol.className='sym';symbol.textContent=x.symbol;
  const meta=document.createElement('div');
  const sec=document.createElement('div');sec.className='sector';sec.textContent=x.sector;
  const pct=document.createElement('div');pct.className='percent';
  pct.textContent=stat?'52주 고점 낙폭 -'+stat.drawdown_52w_pct.toFixed(2)+'%':'52주 상승 '+(x.year===null?'미확인':x.year.toFixed(2)+'%');
  const info=document.createElement('div');info.className='sector';
  if(stat){info.textContent=(stat.watch_candidate?'WATCH · ':'제외 · ')+
    'SMA50 기울기 '+stat.sma50_slope_pct.toFixed(2)+'% / 5일 · SMA20 거리 '+stat.distance_sma20_pct.toFixed(2)+'% · '+stat.bar_date;
    info.className=stat.watch_candidate?'watch':'excluded';
  }else if(scanned){info.textContent='데이터 조회 실패 / 미확인';info.className='excluded';}
  if(signal){
    const s=document.createElement('div');
    s.className=signal.ready?'watch':signal.watch?'watch':'sector';
    s.textContent=signal.ready?'ENTRY 발생 (지연) · Hull20 돌파 · EVP 상승':signal.watch?'30분봉 Hull20 관찰 중':'30분봉 진입 미확인';
    s.textContent+=' · 거리 '+signal.hull_distance_pct.toFixed(2)+'% · 봉 '+signal.bar_start_utc;
    meta.append(s);
  }
  meta.append(sec,pct,info);
  const link=document.createElement('a');link.className='btn';
  link.href='/swing-radar-chart.html?ticker='+encodeURIComponent(x.symbol);link.textContent='Hull20 · Wall 차트 →';
  line.append(rank,symbol,meta,link);list.append(line);
 }
}
async function scanAll(){
 scanBtn.disabled=true;scanned=false;snapshots=new Map();signals=new Map();failures=[];scanStatus.textContent='완료 일봉 수집 시작…';
 let offset=0,done=0;
 const groups=[];for(let i=0;i<rows.length;i+=3)groups.push(rows.slice(i,i+3).map(r=>r.symbol));
 async function worker(){
  while(offset<groups.length){
   const symbols=groups[offset++];let timer;
   try{
    const controller=new AbortController();timer=setTimeout(()=>controller.abort(),27000);
    const response=await fetch('/api/search?mode=top100_pullback_batch&symbols='+encodeURIComponent(symbols.join(',')),{cache:'no-store',signal:controller.signal});
    const result=await response.json();if(!response.ok||result.error||!Array.isArray(result.rows))throw Error(result.error||'Unexpected response');
    for(const v of result.rows)snapshots.set(v.ticker,v);
    for(const e of result.errors||[])failures.push(e.ticker+': '+e.message);
   }catch(e){failures.push(symbols.join(',')+': '+e.message);}
   finally{clearTimeout(timer);}
   done+=symbols.length;scanStatus.textContent='분석 진행: '+done+'/100 · 조회 성공 '+snapshots.size+' · 오류 '+failures.length;
  }
 }
 try{
 await Promise.all([worker(),worker(),worker()]);
 const candidates=rows; // Rank ALL 100 by 30m Hull20 distance, not only daily WATCH.
 const batches=[];for(let i=0;i<candidates.length;i+=2)batches.push(candidates.slice(i,i+2).map(v=>v.symbol));
 let cursor=0;
 async function check30m(){
  while(cursor<batches.length){
   const tickers=batches[cursor++];const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),28000);
   try{
    const response=await fetch('/api/search?mode=top100_30m_entry_batch&symbols='+encodeURIComponent(tickers.join(',')),{signal:controller.signal,cache:'no-store'});
    const json=await response.json();
    if(!response.ok||json.error||!Array.isArray(json.rows))throw Error(json.error||'Unexpected 30m response');
    for(const row of json.rows)signals.set(row.ticker,row);
    for(const err of json.errors||[])failures.push(err.ticker+': '+err.message);
   }catch(e){failures.push(tickers.join(',')+': 30m '+e.message)}
   finally{clearTimeout(timer)}
   scanStatus.textContent='30분봉 진입 신호 분석 '+signals.size+'/'+candidates.length;
  }
 }
 await Promise.all([check30m(),check30m(),check30m(),check30m()]);
 scanned=true;render();scanStatus.textContent='완료: '+snapshots.size+'/100 · 50MA 상승 + 20MA 접촉 WATCH '+[...snapshots.values()].filter(x=>x.watch_candidate).length+'개 · 30분봉 데이터 '+signals.size+'/100 · ENTRY '+[...signals.values()].filter(x=>x.ready).length+'개 · 오류 '+failures.length+(failures.length?' ('+failures.slice(0,5).join(' | ')+')':'');}
 finally{scanBtn.disabled=false;}
}
scanBtn.addEventListener('click',scanAll);q.addEventListener('input',render);sel.addEventListener('change',render);filter.addEventListener('change',render);render();
</script></main></body></html>
