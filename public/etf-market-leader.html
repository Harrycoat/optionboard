<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ETF Market Leader | GEX Option</title>
  <style>
    :root{--bg:#0b0f14;--panel:#111720;--panel2:#151d28;--line:#27303d;--text:#edf2f7;--dim:#8fa0b5;--gold:#e0a838;--red:#e94b55;--blue:#3f83df;--green:#55e6b5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}header{border-bottom:1px solid var(--line);padding:18px 22px}.bar{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:900;color:var(--gold);font-size:19px}.home{color:var(--text);text-decoration:none;border:1px solid var(--line);padding:9px 14px;border-radius:7px}main{max-width:1100px;margin:auto;padding:38px 20px 70px}h1{margin:0 0 8px;font-size:30px}.sub{color:var(--dim);line-height:1.65;margin:0 0 22px}.intro{background:linear-gradient(135deg,rgba(224,168,56,.14),rgba(224,168,56,.03));border:1px solid var(--gold);border-radius:10px;padding:16px 18px;margin-bottom:18px}.intro b{display:block;margin-bottom:7px}.note,.muted{color:var(--dim);font-size:12px}.note{margin:12px 0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.summary div{padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:8px}.summary small{display:block;color:var(--dim);font-size:10px;margin-bottom:4px}.summary b{font-size:17px}.group{margin:12px 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}.sector-row{width:100%;display:grid;grid-template-columns:1.4fr .7fr .8fr .8fr auto;gap:12px;align-items:center;padding:16px 17px;border:0;background:transparent;color:var(--text);text-align:left;cursor:pointer}.sector-row:hover{background:rgba(224,168,56,.04)}.group.open{border-color:rgba(224,168,56,.75)}.sector-title{font-size:17px;font-weight:900}.sector-title small{display:block;color:var(--dim);font-size:11px;margin-top:4px;font-weight:400}.direction{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:900}.direction::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}.direction.up{color:var(--green)}.direction.flat{color:var(--gold)}.direction.down{color:var(--red)}.mono{font-family:Consolas,monospace}.stage{font-size:11px;color:var(--gold)}.arrow{color:var(--dim)}.group.open .arrow{transform:rotate(180deg)}.leaders{display:none;border-top:1px solid var(--line);padding:16px;background:#0e141c}.group.open .leaders{display:block}.leaders-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.leaders-head h2{font-size:15px;margin:0}.leaders-head span{color:var(--dim);font-size:11px}.leader-row{display:grid;grid-template-columns:50px 1fr 90px 120px 1fr 110px;gap:10px;align-items:center;padding:12px 10px;border-top:1px solid var(--line)}.leader-row:first-of-type{border-top:0}.leader-row.winner{background:linear-gradient(90deg,rgba(224,168,56,.1),transparent);border:1px solid rgba(224,168,56,.45);border-radius:8px}.rank{color:var(--gold);font-weight:900}.ticker{font-size:16px;font-weight:900}.leader-reason{color:var(--dim);font-size:11px;line-height:1.45}.wall{font-size:11px;color:var(--dim)}.wall b{font:800 12px Consolas,monospace}.leader-score{font:900 13px Consolas,monospace;color:var(--gold);text-align:right}.sector-conclusion{margin-top:12px;padding:13px 14px;border-left:3px solid var(--gold);border-radius:6px;background:rgba(224,168,56,.06);font-size:12px;line-height:1.6}.empty{padding:30px;text-align:center;color:var(--dim);border:1px solid var(--line);border-radius:8px}@media(max-width:800px){.sector-row{grid-template-columns:1fr 1fr}.leader-row{grid-template-columns:40px 1fr 85px}.leader-reason,.wall{grid-column:2/-1}.summary{grid-template-columns:1fr}.leader-score{text-align:left}}
</style>
<script src="/global-category-nav.js" defer></script>
</head>
<body>
<header><div class="bar"><div class="brand">GEX Option · ETF Market Leader</div><a class="home" href="/">← 메인으로</a></div></header>
<main>
  <h1>🌊 ETF 마켓 리더</h1>
  <p class="sub">ETF 100 순위에서 강한 섹터를 선별하고, 각 ETF의 핵심 주도주 2개를 비교합니다.</p>
  <div class="intro"><b>지금 오르는 섹터 안의 진짜 주도주는?</b><span class="muted">섹터의 방향과 함께 주도주의 GEX 핵심 레벨을 비교합니다.</span></div>
  <div class="note" id="updated">불러오는 중...</div><div class="summary" id="summary" hidden></div><div id="board"><div class="empty">데이터를 불러오는 중...</div></div>
</main>
<script>
const CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vRnoCuQ1-jpfy_LAqCiOBxruPHlX58jFWwB1shKgDICq8VNQhW-8b6FWyYwaHY_43b1Nzc0xtugbIrK/pub?output=csv';
const fmt=(v,d=2)=>v==null?'—':Number(v).toLocaleString('en-US',{maximumFractionDigits:d});
const num=v=>{const x=Number(v);return Number.isFinite(x)?x:null};
function direction(d){const ch=num(d.price_change_pct)||0;if(d.stage===2&&ch>.25)return['상승','up'];if(ch<-.5)return['하락','down'];return['관찰','flat']}
function leaderScore(d,etf){const ch=num(d.price_change_pct)||0,etfCh=num(etf.price_change_pct)||0,spot=num(d.spot),flip=num(d.gamma_flip),call=num(d.call_wall);let s=50;s+=Math.max(-20,Math.min(20,(ch-etfCh)*5));if(d.stage===2)s+=15;else if(d.stage===1)s+=7;if(spot!=null&&flip!=null)s+=spot>=flip?12:-8;if(spot!=null&&call!=null&&spot>=call)s+=10;return Math.max(0,Math.min(100,Math.round(s)))}
function reason(d,etf){const parts=[],ch=num(d.price_change_pct)||0,etfCh=num(etf.price_change_pct)||0,spot=num(d.spot),flip=num(d.gamma_flip),call=num(d.call_wall),put=num(d.put_wall);if(ch>etfCh)parts.push('ETF보다 강함');if(d.stage===2)parts.push('Stage 2');if(spot!=null&&flip!=null)parts.push(spot>=flip?'Gamma Flip 위':'Gamma Flip 아래');if(spot!=null&&call!=null&&spot>=call)parts.push('Call Wall 돌파');else if(spot!=null&&put!=null&&spot<=put*1.02)parts.push('Put Wall 근접');return parts.join(' · ')||'추가 확인 필요'}
function leaderRow(d,etf,i){const score=leaderScore(d,etf);return `<div class="leader-row${i===0?' winner':''}"><span class="rank">#${i+1}</span><span><span class="ticker">${d.ticker}</span>${i===0?'<small style="color:var(--gold);margin-left:7px">현재 주도주</small>':''}<small class="muted" style="display:block;margin-top:4px">$${fmt(d.spot)} · ${(num(d.price_change_pct)||0)>=0?'+':''}${fmt(d.price_change_pct)}%</small></span><span class="stage">STAGE ${d.stage??'—'}</span><span class="leader-reason">${reason(d,etf)}</span><span class="wall">Put <b style="color:var(--blue)">${fmt(d.put_wall,1)}</b> · Flip <b style="color:var(--gold)">${fmt(d.gamma_flip,1)}</b> · Call <b style="color:var(--red)">${fmt(d.call_wall,1)}</b></span><span class="leader-score">주도 점수 ${score}</span></div>`}
function groupHtml(g,etf,leaders){const [dir,cls]=direction(etf),ranked=leaders.map(d=>({d,score:leaderScore(d,etf)})).sort((a,b)=>b.score-a.score),winner=ranked[0]?.d;return `<section class="group"><button class="sector-row" type="button" aria-expanded="false"><span class="sector-title">${g.ticker}<small>${g.name||'섹터 ETF'}</small></span><span class="mono">$${fmt(etf.spot)}</span><span class="direction ${cls}">섹터 ${dir}</span><span class="stage">STAGE ${etf.stage??'—'}</span><span class="arrow">⌄</span></button><div class="leaders"><div class="leaders-head"><h2>실제 주도주 비교</h2><span>섹터 방향 + 상대 움직임 + Stage + GEX 위치</span></div>${ranked.map((x,i)=>leaderRow(x.d,etf,i)).join('')||'<div class="empty">주도주 데이터가 없습니다.</div>'}<div class="sector-conclusion">${winner?`<b>${g.ticker} 섹터의 현재 주도주: ${winner.ticker}</b><br>${reason(winner,etf)}. Put Wall·Gamma Flip·Call Wall 반응을 함께 확인하세요.`:'비교할 주도주 데이터가 없습니다.'}</div></div></section>`}
async function load(){const board=document.getElementById('board'),updated=document.getElementById('updated'),summary=document.getElementById('summary');try{const text=await fetch(CSV,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.text()});const groups=[];text.split(/\r?\n/).forEach(line=>{const p=line.split(','),ticker=(p[0]||'').trim().toUpperCase();if(!/^[A-Z]{1,6}$/.test(ticker)||ticker==='TICKER')return;groups.push({ticker,name:(p[1]||'').trim(),leaders:(p[2]||'').split('|').map(x=>x.trim().toUpperCase()).filter(x=>/^[A-Z]{1,6}$/.test(x)).slice(0,2)})});const list=groups.slice(0,10),tickers=[...new Set(list.flatMap(g=>[g.ticker,...g.leaders]))],results=await Promise.all(tickers.map(t=>fetch('/api/search?ticker='+encodeURIComponent(t)).then(r=>r.ok?r.json():null).catch(()=>null))),map={};tickers.forEach((t,i)=>{if(results[i]&&!results[i].error)map[t]=results[i]});const valid=list.filter(g=>map[g.ticker]),up=valid.filter(g=>direction(map[g.ticker])[0]==='상승').length,leaderCount=valid.reduce((n,g)=>n+g.leaders.filter(t=>map[t]).length,0);summary.hidden=false;summary.innerHTML=`<div><small>분석 ETF</small><b>${valid.length}개</b></div><div><small>상승 ETF</small><b style="color:var(--green)">${up}개</b></div><div><small>핵심 주도주</small><b>${leaderCount}개</b></div>`;board.innerHTML=valid.map(g=>groupHtml(g,map[g.ticker],g.leaders.filter(t=>map[t]).map(t=>map[t]))).join('')||'<div class="empty">데이터를 불러오지 못했습니다.</div>';board.onclick=e=>{const btn=e.target.closest('.sector-row');if(!btn)return;const group=btn.closest('.group'),open=group.classList.toggle('open');btn.setAttribute('aria-expanded',String(open))};updated.textContent='주간 ETF 100 · '+new Date().toLocaleTimeString('ko-KR')+' 기준'}catch(e){board.innerHTML='<div class="empty">데이터를 불러오지 못했습니다.</div>';updated.textContent='' }}load();
</script>
</body></html>
