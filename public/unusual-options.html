<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>오늘의 이상 옵션 거래 | GEX Option</title>
  <style>
    :root{--bg:#0b0f14;--panel:#111720;--line:#27303d;--text:#edf2f7;--dim:#8fa0b5;--gold:#e0a838;--call:#e94b55;--put:#3f83df;--green:#55e6b5}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}header{border-bottom:1px solid var(--line);padding:18px 22px}.bar{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:900;color:var(--gold);font-size:19px}.home{color:var(--text);text-decoration:none;border:1px solid var(--line);padding:9px 14px;border-radius:7px}main{max-width:1100px;margin:auto;padding:38px 20px 70px}h1{margin:0 0 8px;font-size:30px}.sub{color:var(--dim);line-height:1.65;margin:0 0 22px}.intro{background:linear-gradient(135deg,rgba(224,168,56,.14),rgba(224,168,56,.03));border:1px solid var(--gold);border-radius:10px;padding:16px 18px;margin-bottom:18px}.intro b{display:block;margin-bottom:7px}.note{color:var(--dim);font-size:12px;margin:12px 0}.row{display:flex;align-items:center;gap:13px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:8px 0}.rank{color:var(--gold);font-weight:800}.ticker{font-size:17px;font-weight:900;min-width:62px}.mono{font-family:Consolas,monospace}.muted{color:var(--dim);font-size:12px}.badge{padding:4px 8px;border-radius:5px;font-weight:800;font-size:12px}.ratio{color:var(--gold);background:rgba(224,168,56,.13)}.empty{padding:30px;text-align:center;color:var(--dim);border:1px solid var(--line);border-radius:8px}
  </style>
</head>
<body>
<header><div class="bar"><div class="brand">GEX Option · Unusual Options</div><a class="home" href="/">← 메인으로</a></div></header>
<main>
  <h1>🚨 오늘의 이상 옵션 거래</h1>
  <p class="sub">거래량이 기존 미결제약정(OI)보다 유난히 크게 증가한 옵션 계약을 보여드립니다.</p>
  <div class="intro"><b>🐋 기관은 오늘 어디에 베팅했을까?</b><span class="muted">유동성 상위 종목에서 새로 유입된 대규모 포지션 가능성을 확인합니다. 데이터는 약 15분 지연됩니다.</span></div>
  <div class="note" id="updated">불러오는 중...</div>
  <div id="board"><div class="empty">데이터를 불러오는 중...</div></div>
</main>
<script>
const fmt=(v,d=2)=>v==null?'—':Number(v).toLocaleString('en-US',{maximumFractionDigits:d});
const vol=v=>v==null?'—':v>=1e6?(v/1e6).toFixed(2)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':fmt(v,0);
async function load(){
  const board=document.getElementById('board'),updated=document.getElementById('updated');
  try{
    const res=await fetch('/leaders_report.json',{cache:'no-store'}); if(!res.ok)throw Error();
    const report=await res.json(),rows=report.unusual_options_activity||[];
    if(!rows.length){board.innerHTML='<div class="empty">오늘 이상 옵션 거래가 없습니다.</div>';updated.textContent='';return}
    board.innerHTML=rows.map((r,i)=>{const call=r.side==='call',color=call?'var(--call)':'var(--put)',ratio=r.vol_oi_ratio!=null?fmt(r.vol_oi_ratio,2)+'x':'—';return `<div class="row"><span class="rank">#${i+1}</span><span class="ticker">${r.ticker}</span><span class="mono muted">$${fmt(r.spot)}</span><span class="badge mono" style="color:${color};background:${call?'rgba(233,75,85,.13)':'rgba(63,131,223,.13)'}">${fmt(r.strike,1)} ${call?'콜':'풋'}</span><span class="muted">거래량 <b>${vol(r.volume)}</b></span><span class="muted">OI <b>${vol(r.oi)}</b></span><span class="badge ratio">Vol/OI ${ratio}</span>${r.is_new_contract?'<span class="badge" style="color:var(--green);background:rgba(85,230,181,.12)">신규 계약</span>':''}</div>`}).join('');
    updated.textContent=report.generated_at?'마지막 갱신: '+new Date(report.generated_at).toLocaleString('ko-KR'):'매일 장마감 후 자동 계산';
  }catch(e){board.innerHTML='<div class="empty">데이터를 불러오지 못했습니다.</div>';updated.textContent=''}
}
load();
</script>
</body></html>
