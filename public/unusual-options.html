<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>오늘의 이상 옵션 거래 | GEX Option</title>
  <style>
    :root{--bg:#0b0f14;--panel:#111720;--panel2:#151d28;--line:#27303d;--text:#edf2f7;--dim:#8fa0b5;--gold:#e0a838;--call:#e94b55;--put:#3f83df;--green:#55e6b5}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}header{border-bottom:1px solid var(--line);padding:18px 22px}.bar{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:900;color:var(--gold);font-size:19px}.home{color:var(--text);text-decoration:none;border:1px solid var(--line);padding:9px 14px;border-radius:7px}main{max-width:1100px;margin:auto;padding:38px 20px 70px}h1{margin:0 0 8px;font-size:30px}.sub{color:var(--dim);line-height:1.65;margin:0 0 22px}.intro{background:linear-gradient(135deg,rgba(224,168,56,.14),rgba(224,168,56,.03));border:1px solid var(--gold);border-radius:10px;padding:16px 18px;margin-bottom:18px}.intro b{display:block;margin-bottom:7px}.note{color:var(--dim);font-size:12px;margin:12px 0}.option-item{margin:8px 0}.row{width:100%;display:flex;align-items:center;gap:13px;flex-wrap:wrap;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:14px 16px;text-align:left;cursor:pointer;font:inherit}.row:hover{border-color:rgba(224,168,56,.65)}.option-item.open .row{border-color:var(--gold);border-radius:8px 8px 0 0}.row-arrow{margin-left:auto;color:var(--dim);font-size:13px}.option-item.open .row-arrow{transform:rotate(180deg)}.rank{color:var(--gold);font-weight:800}.ticker{font-size:17px;font-weight:900;min-width:62px}.mono{font-family:Consolas,monospace}.muted{color:var(--dim);font-size:12px}.badge{padding:4px 8px;border-radius:5px;font-weight:800;font-size:12px}.ratio{color:var(--gold);background:rgba(224,168,56,.13)}.empty{padding:30px;text-align:center;color:var(--dim);border:1px solid var(--line);border-radius:8px}
    .decision{display:none;border:1px solid var(--gold);border-top:0;border-radius:0 0 9px 9px;background:linear-gradient(145deg,#131b26,#0f151e);padding:18px}.option-item.open .decision{display:block}.decision-loading{color:var(--dim);padding:18px;text-align:center}.decision-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.decision-title{font-size:20px;font-weight:900}.decision-status{padding:7px 11px;border:1px solid currentColor;border-radius:7px;color:var(--green);font-size:12px;font-weight:900}.delay{color:var(--dim);font-size:11px}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:16px}.metric{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:11px 7px;text-align:center}.metric small{display:block;color:var(--dim);font-size:10px;margin-bottom:5px}.metric b{font:800 14px Consolas,monospace}.rail-wrap{background:var(--panel2);border:1px solid var(--line);border-radius:8px;margin-top:12px;padding:12px 18px 7px}.rail{position:relative;height:5px;border-radius:5px;background:linear-gradient(90deg,var(--put),#76849b 50%,var(--call));margin:37px 10px 29px}.marker{position:absolute;top:50%;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;border:2px solid #0e141d}.marker span{position:absolute;left:50%;bottom:17px;transform:translateX(-50%);white-space:nowrap;text-align:center;font:800 10px/1.4 Consolas,monospace}.response{display:grid;grid-template-columns:1fr auto;align-items:end;gap:18px;margin-top:13px;padding:14px 15px;border-left:3px solid var(--gold);background:rgba(224,168,56,.06);border-radius:7px}.response h3{margin:0 0 6px;font-size:14px}.response p{margin:0;color:var(--dim);font-size:12px;line-height:1.65}.actions{display:flex;gap:8px}.action{border:1px solid var(--gold);border-radius:7px;padding:10px 13px;background:transparent;color:var(--text);text-decoration:none;font-size:12px;font-weight:900;white-space:nowrap}.action.primary{background:var(--gold);color:#111}.data-pending{color:var(--dim)!important;font-family:Arial,"Noto Sans KR",sans-serif!important;font-size:11px!important}@media(max-width:800px){.metrics{grid-template-columns:repeat(3,1fr)}.response{grid-template-columns:1fr}.actions{flex-wrap:wrap}}@media(max-width:520px){main{padding:28px 12px 60px}.metrics{grid-template-columns:repeat(2,1fr)}.row{gap:9px;padding:12px}.decision{padding:12px}.rail-wrap{padding-left:7px;padding-right:7px}}
</style>
<script src="/global-category-nav.js" defer></script>
</head>
<body>
<header><div class="bar"><div class="brand">GEX Option · Unusual Options</div><a class="home" href="/">← 메인으로</a></div></header>
<main>
  <h1>🚨 오늘의 이상 옵션 거래</h1>
  <p class="sub">거래량이 기존 미결제약정(OI)보다 유난히 크게 증가한 옵션 계약을 보여드립니다.</p>
  <div class="intro"><b>🐋 기관은 오늘 어디에 베팅했을까?</b><span class="muted">유동성 상위 종목에서 새로 유입된 대규모 포지션 가능성을 확인합니다. 데이터는 약 15분 지연됩니다.</span></div>
  <div class="note" id="updated">불러오는 중...</div>
  <div id="board"><div class="empty">데이터를 불러오는 중...</div></div>
</main>
<script>
const fmt=(v,d=2)=>v==null?'—':Number(v).toLocaleString('en-US',{maximumFractionDigits:d});
const vol=v=>v==null?'—':v>=1e6?(v/1e6).toFixed(2)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':fmt(v,0);
async function load(){
  const board=document.getElementById('board'),updated=document.getElementById('updated');
  try{
    const res=await fetch('/leaders_report.json',{cache:'no-store'}); if(!res.ok)throw Error();
    const report=await res.json(),rows=report.unusual_options_activity||[];
    if(!rows.length){board.innerHTML='<div class="empty">오늘 이상 옵션 거래가 없습니다.</div>';updated.textContent='';return}
    board.innerHTML=rows.map((r,i)=>{const call=r.side==='call',color=call?'var(--call)':'var(--put)',ratio=r.vol_oi_ratio!=null?fmt(r.vol_oi_ratio,2)+'x':'—';return `<article class="option-item" data-index="${i}"><button class="row" type="button" aria-expanded="false"><span class="rank">#${i+1}</span><span class="ticker">${r.ticker}</span><span class="mono muted">$${fmt(r.spot)}</span><span class="badge mono" style="color:${color};background:${call?'rgba(233,75,85,.13)':'rgba(63,131,223,.13)'}">${fmt(r.strike,1)} ${call?'콜':'풋'}</span><span class="muted">거래량 <b>${vol(r.volume)}</b></span><span class="muted">OI <b>${vol(r.oi)}</b></span><span class="badge ratio">Vol/OI ${ratio}</span>${r.is_new_contract?'<span class="badge" style="color:var(--green);background:rgba(85,230,181,.12)">신규 계약</span>':''}<span class="row-arrow">⌄</span></button><div class="decision"><div class="decision-loading">투자판단 데이터를 불러오는 중...</div></div></article>`}).join('');
    board.onclick=e=>{const row=e.target.closest('.row');if(!row)return;toggleDecision(row.closest('.option-item'),rows[Number(row.closest('.option-item').dataset.index)])};
    updated.textContent=report.generated_at?'마지막 갱신: '+new Date(report.generated_at).toLocaleString('ko-KR'):'매일 장마감 후 자동 계산';
  }catch(e){board.innerHTML='<div class="empty">데이터를 불러오지 못했습니다.</div>';updated.textContent=''}
}
function n(v){const x=Number(v);return Number.isFinite(x)?x:null}
function statusFor(d){const s=n(d.spot),p=n(d.put_wall),c=n(d.call_wall),f=n(d.gamma_flip);if(s!=null&&p!=null&&s<=p*1.02)return['진입 검토','#66a1fa'];if(s!=null&&c!=null&&s>=c*.98)return['헤지 검토','#ff7278'];if(s!=null&&f!=null&&s>=f)return['보유','#55e6b5'];return['관찰','#e0a838']}
function marker(left,color,label,value){return `<i class="marker" style="left:${left}%;background:${color};box-shadow:0 0 11px ${color}"><span style="color:${color}">${label}<br>$${fmt(value,1)}</span></i>`}
function responseText(r,d,status){const side=r.side==='call'?'콜':'풋',s=n(d.spot),p=n(d.put_wall),c=n(d.call_wall);if(status==='진입 검토')return `현재가가 Put Wall $${fmt(p,1)} 부근입니다. ${side} 거래 급증만으로 방향을 단정하지 말고 지지와 거래량 반등을 확인하세요.`;if(status==='헤지 검토')return `현재가가 Call Wall $${fmt(c,1)} 부근입니다. ${side} 거래와 함께 저항 반응을 확인하고 추격보다 위험 관리를 우선하세요.`;if(status==='보유')return `현재가가 Gamma Flip 위, Call Wall 아래에 있습니다. 추세를 관찰하고 Call Wall $${fmt(c,1)} 접근 시 반응을 확인하세요.`;return `${side} 거래가 급증했습니다. 방향을 단정하지 말고 Put Wall $${fmt(p,1)} 지지와 Call Wall $${fmt(c,1)} 반응을 확인하세요.`}
function decisionHTML(r,d){
  const spot=n(d.spot)??n(r.spot),put=n(d.put_wall),call=n(d.call_wall),flip=n(d.gamma_flip),[status,statusColor]=statusFor({...d,spot});
  const levels=[put,spot,call].filter(v=>v!=null),min=levels.length?Math.min(...levels):0,max=levels.length?Math.max(...levels):1,pad=Math.max((max-min)*.18,1),lo=min-pad,hi=max+pad,pos=v=>v==null?50:Math.max(5,Math.min(95,(v-lo)/(hi-lo)*100));
  const iv=r.implied_volatility!=null?`${fmt(Number(r.implied_volatility)*100,0)}%`:'데이터 준비 중',earn=r.earnings_d_day!=null?`D-${r.earnings_d_day}`:'데이터 준비 중';
  return `<div class="decision-head"><div><span class="decision-title">${r.ticker} 투자판단</span> <span class="decision-status" style="color:${statusColor}">현재 판단 · ${status}</span></div><span class="delay">옵션 데이터 15분 지연</span></div><div class="metrics"><div class="metric"><small>현재가</small><b>$${fmt(spot)}</b></div><div class="metric"><small>PUT WALL</small><b style="color:var(--put)">$${fmt(put,1)}</b></div><div class="metric"><small>GAMMA FLIP</small><b style="color:var(--gold)">$${fmt(flip,1)}</b></div><div class="metric"><small>CALL WALL</small><b style="color:var(--call)">$${fmt(call,1)}</b></div><div class="metric"><small>IV 상태</small><b class="${r.implied_volatility==null?'data-pending':''}">${iv}</b></div><div class="metric"><small>실적</small><b class="${r.earnings_d_day==null?'data-pending':''}">${earn}</b></div></div><div class="rail-wrap"><div class="rail">${marker(pos(put),'var(--put)','Put Wall',put)}${marker(pos(spot),'var(--gold)','현재가',spot)}${marker(pos(call),'var(--call)','Call Wall',call)}</div></div><div class="response"><div><h3>오늘의 대응</h3><p>${responseText(r,{...d,spot},status)}</p></div><div class="actions"><a class="action primary" href="/?ticker=${encodeURIComponent(r.ticker)}#detailSection">상세 분석 보기</a><a class="action" href="/?view=watchlist#interestSection">☆ 관심종목 추가</a></div></div>`
}
async function toggleDecision(item,r){
  const wasOpen=item.classList.contains('open');document.querySelectorAll('.option-item.open').forEach(el=>{el.classList.remove('open');el.querySelector('.row').setAttribute('aria-expanded','false')});if(wasOpen)return;item.classList.add('open');item.querySelector('.row').setAttribute('aria-expanded','true');const panel=item.querySelector('.decision');if(panel.dataset.loaded)return;panel.innerHTML='<div class="decision-loading">투자판단 데이터를 불러오는 중...</div>';
  try{const res=await fetch(`/api/search?ticker=${encodeURIComponent(r.ticker)}&view=summary`);const d=await res.json();if(!res.ok||d.error)throw Error(d.error||'조회 실패');panel.innerHTML=decisionHTML(r,d);panel.dataset.loaded='1'}catch(e){panel.innerHTML='<div class="decision-loading">투자판단 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>'}
}
load();
</script>
</body></html>
