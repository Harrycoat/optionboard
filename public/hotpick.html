<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 핫픽 | GEX Option</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#0a0d12; --panel:#10141b; --panel-2:#151a22; --line:#1f2530;
    --text:#e7e5df; --text-dim:#8b93a1; --up:#e5484d; --down:#3d7fe0; --gold:#e0a838;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Pretendard',-apple-system,sans-serif; }
  .mono{ font-family:'JetBrains Mono',monospace; }
  a.home{ display:inline-block; color:var(--gold); text-decoration:none; font-size:14px; padding:20px; }
  main{ max-width:760px; margin:0 auto; padding:0 20px 80px; }
  .head{ display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:6px;}
  .head h1{ font-size:26px; font-family:'JetBrains Mono',monospace; }
  .head .price{ font-size:28px; font-family:'JetBrains Mono',monospace; color:var(--gold); }
  .desc{ font-size:13px; color:var(--text-dim); margin-bottom:20px; }
  .box{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:18px; }
  .box-title{ font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:10px; }
  .signal-line{ font-size:13px; line-height:1.7; }
  .canslim-row{ display:flex; align-items:center; gap:12px; padding:9px 10px; background:var(--panel-2); border-radius:6px; margin-bottom:6px; }
  .canslim-row .letter{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px; width:18px; }
  .canslim-row .title{ font-size:13px; min-width:120px; }
  .canslim-row .comment{ font-size:12px; color:var(--text-dim); flex:1; }
  .canslim-row .badge{ font-size:10px; font-weight:700; padding:2px 8px; border-radius:4px; }
  .gex-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; }
  .gex-item{ background:var(--panel-2); border-radius:6px; padding:10px 12px; }
  .gex-item .label{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; }
  .gex-item .value{ font-family:'JetBrains Mono',monospace; font-size:15px; margin-top:3px; }
  .empty{ color:var(--text-dim); font-size:13px; padding:40px 20px; text-align:center; }
  .disclaimer{ font-size:10.5px; color:var(--text-dim); opacity:0.7; line-height:1.6; border-top:1px solid var(--line); padding-top:12px; margin-top:8px; }
</style>
</head>
<body>
<a class="home" href="/">&larr; GEX Option 홈으로</a>
<main>
  <div id="hotpickDetail"><div class="empty">불러오는 중...</div></div>
</main>

<script>
const UP = '#e5484d', DOWN = '#3d7fe0', GOLD = '#e0a838', GREEN_OK = '#22c55e';

const HOTPICK_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTt_ZzCVGwhoZv_-_ntsqW_6wJ-iMakD5v5LOxtr8tDgxBKGgOl8e_tI-x_oyPKNEMWx1Nc-Uh_gnUs/pub?output=csv";

const CANSLIM_LABELS = {
  C: '당분기 EPS 성장률', A: '연간 EPS 성장률', N: '신제품/신고가',
  S: '수급 (유통물량)', L: '업종 내 리더십', I: '기관 수급', M: '시장 방향성',
};
const CANSLIM_ORDER = ['C','A','N','S','L','I','M'];

function fmtNum(n, digits=2){
  if(n===null || n===undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('en-US', {maximumFractionDigits:digits});
}

function parseCsvLine(line){
  const out = [];
  let cur = '', inQ = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(ch === '"'){
      if(inQ && line[i+1] === '"'){ cur += '"'; i++; }
      else inQ = !inQ;
    } else if(ch === ',' && !inQ){
      out.push(cur); cur = '';
    } else {
      cur += ch;
    }
  }
  out.push(cur);
  return out;
}

async function fetchLatestHotpickRow(){
  const res = await fetch(HOTPICK_SHEET_CSV_URL, { cache: 'no-store' });
  if(!res.ok) throw new Error('시트 로드 실패');
  const text = await res.text();
  const rawLines = text.split(/\r?\n/);

  let headerIdx = -1;
  for(let i=0;i<rawLines.length;i++){
    const cells = parseCsvLine(rawLines[i]);
    if(cells[0] === '날짜'){ headerIdx = i; break; }
  }
  if(headerIdx === -1) throw new Error('헤더 행을 찾지 못했습니다');

  const headers = parseCsvLine(rawLines[headerIdx]);
  const rows = [];
  for(let i = headerIdx + 1; i < rawLines.length; i++){
    const cells = parseCsvLine(rawLines[i]);
    const ticker = (cells[1] || '').trim().toUpperCase();
    if(!/^[A-Z]{1,6}$/.test(ticker)) continue;
    const row = {};
    headers.forEach((h, idx) => { row[h] = (cells[idx] || '').trim(); });
    rows.push(row);
  }
  if(!rows.length) throw new Error('유효한 핫픽 데이터가 없습니다');
  return rows[rows.length - 1];
}

function canslimRowHTML(letter, row){
  const score = row[`${letter}_점수`];
  const comment = row[`${letter}_코멘트`] || '(자동계산 예정)';
  const hasScore = score === '0' || score === '1' || score === '2';
  const color = !hasScore ? '#8b93a1' : (score === '2' ? GREEN_OK : score === '1' ? GOLD : UP);
  const label = !hasScore ? '—' : (score === '2' ? '우수' : score === '1' ? '보통' : '주의');
  return `
    <div class="canslim-row">
      <span class="letter" style="color:${color}">${letter}</span>
      <span class="title">${CANSLIM_LABELS[letter]}</span>
      <span class="comment">${comment}</span>
      <span class="badge" style="background:${color}22; color:${color};">${label}</span>
    </div>`;
}

async function loadDetail(){
  const el = document.getElementById('hotpickDetail');

  let row;
  try{
    row = await fetchLatestHotpickRow();
  }catch(e){
    el.innerHTML = '<div class="empty">오늘의 핫픽 데이터를 불러오지 못했습니다</div>';
    return;
  }

  let gex = null;
  try{
    const gexRes = await fetch(`/api/search?ticker=${encodeURIComponent(row['티커'])}`);
    gex = await gexRes.json();
    if(gex.error) gex = null;
  }catch(e){ gex = null; }

  const priceText = row['진입가'] ? row['진입가'].replace(/^\$/, '') : (gex ? fmtNum(gex.spot) : '—');

  const gexHtml = gex ? `
    <div class="gex-grid">
      <div class="gex-item"><div class="label">Max Pain</div><div class="value">${fmtNum(gex.max_pain,1)}</div></div>
      <div class="gex-item"><div class="label">Call Wall</div><div class="value" style="color:${UP}">${fmtNum(gex.call_wall,1)}</div></div>
      <div class="gex-item"><div class="label">Put Wall</div><div class="value" style="color:${DOWN}">${fmtNum(gex.put_wall,1)}</div></div>
      <div class="gex-item"><div class="label">Gamma Flip</div><div class="value" style="color:${GOLD}">${fmtNum(gex.gamma_flip,1)}</div></div>
    </div>`
    : '<div class="empty" style="padding:20px;">GEX 데이터를 불러오지 못했습니다</div>';

  const canslimHtml = CANSLIM_ORDER.map(l => canslimRowHTML(l, row)).join('');

  el.innerHTML = `
    <div class="head">
      <div>
        <h1>${row['티커']} <span style="font-size:14px; color:var(--text-dim); font-weight:400;">${row['회사명'] || ''}</span></h1>
      </div>
      <div class="price">$${priceText}</div>
    </div>
    <div class="desc">${row['회사설명(한줄)'] || ''}</div>

    <div class="box">
      <div class="box-title">진입 시그널</div>
      <div class="signal-line"><b style="color:${GOLD}">${row['시그널종류'] || '—'}</b>${row['시그널일자'] ? ` · ${row['시그널일자']} 발생` : ''}</div>
    </div>

    <div class="box-title" style="margin-bottom:8px;">CANSLIM 분석</div>
    <div style="margin-bottom:18px;">${canslimHtml}</div>

    <div class="box-title" style="margin-bottom:8px;">GEX 레벨</div>
    <div class="box">${gexHtml}</div>

    <div class="disclaimer">
     ⚠️ 이 추천은 참고용 데이터이며 매수를 권하는 데이터가 아닙니다. 매수 판단은 본인이 결정하시기 바랍니다. 본 분석은 매수/매도를 권유하는 투자자문이 아니며, CANSLIM 점수는 편집자의 정성적 판단이 포함된 콘텐츠이고, GEX 레벨은 Massive.com(15분 지연) 옵션 데이터 기반으로 실시간 계산됩니다.

    </div>
  `;
}

loadDetail();
</script>
</body>
</html>
