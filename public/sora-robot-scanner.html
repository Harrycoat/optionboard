<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SORA 전략별 스캐너</title><style>body{margin:0;background:#f5f8fb;color:#183247;font:15px system-ui,sans-serif}main{max-width:850px;margin:25px auto;padding:0 16px}.panel{background:white;border:1px solid #dbe5eb;border-radius:12px;padding:22px;margin:14px 0}a{color:#08785c;font-weight:700;text-decoration:none}.note{background:#fff4da;padding:13px;border-radius:8px}.row{padding:12px;background:#f2f7f8;border-radius:8px;margin:8px 0}h1{font-size:24px}p{line-height:1.6}button{background:#08785c;color:white;border:0;padding:11px;border-radius:8px;cursor:pointer}small{color:#647888}.buyLink{display:inline-block;background:#08785c;color:white;padding:9px 12px;border-radius:8px;margin-top:8px;text-decoration:none}.buyLink:focus{outline:2px solid #063}</style></head><body><main><p><a href="/portfolio-hub.html">← SORA 포트폴리오 돌아가기</a></p><section class="panel"><h1 id="title">SORA 전략 스캐너</h1><p id="strategy"></p><p class="note">스캐너는 후보 검색 전용입니다. 관리자 검토 전 자동 가상매수를 하지 않습니다. 검증되지 않은 Smooth/VCP/Wall 신호는 매수 신호로 표시하지 않습니다.</p><h2>종목 검색</h2><p><a href="/swing-top100.html">기존 일봉 주도주·눌림목 스캐너 열기 ↗</a></p><p><a href="/sora-core-admin.html">관리자 CORE 가상매수 입력 ↗</a> <small>(현재 SORA 01 전용)</small></p><h2>전략별 자동 검색 상태</h2><div id="results" class="row">연결 상태 확인 중…</div></section></main><script>
const strategies={"SORA-01":"CORE 장기투자 · 20/50일선","SORA-02":"CORE 80 + SWING 20","SORA-03":"빅테크 20/50일선 분할","SORA-04":"성장주 골든크로스 30/30/40","SORA-05":"Hull21 재진입 · Smooth 반전","SORA-06":"미너비니 SEPA · VCP 피벗 돌파","SORA-07":"강한 섹터 로테이션","SORA-08":"GEX Wall 반전","SORA-09":"QLD / QQQ 50일선 DCA","SORA-10":"TQQQ / QQQ 200일선 DCA"};
function addBuyLink(card,ticker){const link=document.createElement("a");link.className="buyLink";link.textContent="관리자 가상매수 ↗";link.href="/sora-core-admin.html?robot="+encodeURIComponent(id)+"&ticker="+encodeURIComponent(ticker);link.title="관리자 인증 및 체결가·수량 확인 필요. 자동 체결하지 않음";card.append(link)}
const id=new URLSearchParams(location.search).get("robot")||"SORA-01";const label=strategies[id],results=document.getElementById("results");if(!label){results.textContent="등록되지 않은 로봇입니다."}else{document.getElementById("title").textContent=id+" · 전략 스캐너";document.getElementById("strategy").textContent=label;
if(id==="SORA-06"){fetch("/api/sora_minervini_scan",{cache:"no-store"}).then(async r=>({ok:r.ok,data:await r.json()})).then(({ok,data})=>{results.replaceChildren();if(!ok){results.textContent="일봉 데이터 조회 실패 · 자동매수 없음";return}const summary=document.createElement("p");summary.textContent="미너비니 추세/VCP 후보 검색 · "+data.scanned+"개 종목 시도 · 후보 "+data.candidate_count+"개 · 마지막 확정 일봉 기준";results.append(summary);const rows=(data.results||[]).filter(x=>x.status!=="NOT_QUALIFIED");if(!rows.length){const msg=document.createElement("p");msg.textContent="현재 조건을 통과한 종목이 없습니다. 데이터 오류 "+Object.keys(data.errors||{}).length+"건";results.append(msg)}for(const x of rows){const card=document.createElement("div");card.className="row";const title=document.createElement("b");title.textContent=x.ticker+" · "+x.status;const info=document.createElement("p");info.textContent="종가 $"+x.close+" | 피벗 $"+x.pivot+" ("+x.pivot_distance_pct+"%) | 50/150/200MA 추세 "+(x.trend_template?"충족":"미충족");const detail=document.createElement("small");detail.textContent="조정폭 "+x.contractions_pct.join(" → ")+"% | 거래량 감소 "+(x.volume_drying?"예":"아니오")+" | 기준일 "+x.bar_date_utc+" | 관리자 검토 필요";card.append(title,info,detail);addBuyLink(card,x.ticker);results.append(card)}const caution=document.createElement("p");caution.textContent="VCP 후보 추정치입니다. 정식 VCP 확정/매수 신호가 아니며 지수 구성·상대강도·분봉 Smooth는 아직 미검증입니다.";results.append(caution)}).catch(()=>{results.textContent="스캐너 API 연결 오류 · 매수 없음"})}else if(["SORA-01","SORA-02","SORA-03","SORA-04"].includes(id)){fetch("/api/sora_ten_market_scan",{cache:"no-store"}).then(r=>r.json().then(x=>({ok:r.ok,data:x}))).then(({ok,data})=>{if(!ok){results.textContent="시장 데이터 연결 확인 전 · "+(data.status||"UNAVAILABLE");return}results.replaceChildren();const head=document.createElement("p");head.textContent="완료 일봉 검색 · "+(data.quotes_loaded||[]).join(", ")+" · 매수 승인 아님";results.append(head);const rows=(data.discovery_watch||[]).filter(x=>x.status==="WATCH");if(!rows.length){const p=document.createElement("p");p.textContent="현재 검증된 관찰 후보 없음 (지수 편입·분봉 진입 조건 별도 검증 필요)";results.append(p)}for(const x of rows){const p=document.createElement("p");p.textContent=x.ticker+" · 20일선 근접 "+(x.near20?"예":"아니오")+" · 50일선 근접 "+(x.near50?"예":"아니오")+" · WATCH";results.append(p);addBuyLink(results,x.ticker)}}).catch(()=>{results.textContent="시장 데이터 확인 실패. 자동 가상매수 없음."})}else{results.textContent="전략 전용 자동 검색 미연결 · 기존 주도주 스캐너로 후보를 확인한 뒤 관리자가 검토합니다. VCP·GEX·실제 Smooth 조건은 아직 검증되지 않았습니다."}}
</script></body></html>
