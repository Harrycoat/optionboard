<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>옵션보드 — Max Pain · GEX 대시보드</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --bg: #0a0d12;
    --panel: #10141b;
    --panel-2: #151a22;
    --line: #1f2530;
    --text: #e7e5df;
    --text-dim: #8b93a1;
    --up: #e5484d;
    --down: #3d7fe0;
    --gold: #e0a838;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', -apple-system, sans-serif;
    min-height: 100vh;
  }
  .mono{ font-family:'JetBrains Mono', monospace; }

  header{
    border-bottom: 1px solid var(--line);
    padding: 18px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    position: sticky; top:0; background: rgba(10,13,18,0.92); backdrop-filter: blur(8px);
    z-index: 10;
  }
  .logo{ display:flex; align-items:center; gap:10px; }
  .logo .dot{ width:8px; height:8px; border-radius:50%; background: var(--gold); box-shadow:0 0 8px var(--gold); }
  .logo b{ letter-spacing: 0.02em; font-size: 17px; }
  .logo span{ color: var(--text-dim); font-size:12px; }

  .searchbar{ display:flex; gap:8px; flex:1; max-width: 420px; }
  .searchbar input{
    flex:1; background: var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding: 9px 12px; border-radius: 6px; font-family:'JetBrains Mono', monospace; font-size:14px;
    letter-spacing: 0.03em;
  }
  .searchbar input:focus{ outline:none; border-color: var(--gold); }
  .searchbar button{
    background: var(--gold); color:#111; border:none; padding: 9px 16px; border-radius:6px;
    font-weight:700; cursor:pointer; font-size:13px;
  }
  .searchbar button:hover{ filter: brightness(1.1); }
  .searchbar button:disabled{ opacity:0.5; cursor: default; }

  main{ max-width: 1100px; margin: 0 auto; padding: 24px 20px 80px; }

  .updated-note{ color: var(--text-dim); font-size:12px; margin-bottom:18px; font-family:'JetBrains Mono',monospace;}

  .section-title{
    font-size: 13px; color: var(--text-dim); text-transform:uppercase; letter-spacing:0.12em;
    margin: 28px 0 12px; display:flex; align-items:center; gap:8px;
  }
  .section-title::before{ content:''; width:3px; height:12px; background: var(--gold); display:inline-block;}

  .watchlist-grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap:10px;
  }
  .wcard{
    background: var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px;
    cursor:pointer; transition: border-color .15s;
  }
  .wcard:hover{ border-color: var(--gold); }
  .wcard .t{ font-weight:700; font-size:15px; letter-spacing:0.02em; }
  .wcard .spot{ font-family:'JetBrains Mono',monospace; font-size:20px; margin-top:6px; }
  .wcard .rows{ margin-top:10px; font-size:12px; color:var(--text-dim); display:flex; flex-direction:column; gap:4px; }
  .wcard .rows .r{ display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace;}
  .wcard .rows .r b{ color: var(--text); font-weight:500; }
  .badge{ display:inline-block; font-size:10px; padding:2px 6px; border-radius:4px; font-weight:700; margin-top:8px;}
  .badge.pos{ background: rgba(229,72,77,0.15); color: var(--up); }
  .badge.neg{ background: rgba(61,127,224,0.15); color: var(--down); }

  .empty{ color: var(--text-dim); font-size:13px; padding: 20px; border:1px dashed var(--line); border-radius:8px; text-align:center;}

  .leaders-grid{
    display:grid; grid-template-columns: repeat(3, 1fr); gap:14px;
  }
  @media (max-width: 720px){
    .leaders-grid{ grid-template-columns: 1fr; }
  }
  .leader-col{
    background: var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px;
  }
  .leader-col-header{ font-size:14px; font-weight:700; margin-bottom:2px; }
  .leader-col-header.wave1{ color: var(--up); }
  .leader-col-header.wave2{ color: var(--down); }
  .leader-col-header.speculative{ color: var(--gold); }
  .leader-col-desc{ font-size:11px; color: var(--text-dim); margin-bottom:12px; }
  .leader-card{
    display:flex; justify-content:space-between; align-items:center;
    padding: 9px 4px; border-bottom: 1px solid var(--line); cursor:pointer;
  }
  .leader-card:last-child{ border-bottom:none; }
  .leader-card:hover{ opacity:0.8; }
  .leader-ticker{ font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700; color: var(--text); }
  .leader-sector{ font-size:10px; color: var(--text-dim); margin-top:2px; }
  .leader-badge{ font-family:'JetBrains Mono',monospace; font-size:11px; text-align:right; }
  .badge-distance{ color: var(--text-dim); }
  .badge-distance.near{ color: var(--up); }
  .badge-regime{ display:inline-block; margin-top:3px; padding:1px 6px; border-radius:3px; font-size:9px; }
  .badge-regime.positive{ background: rgba(61,127,224,0.15); color: var(--down); }
  .badge-regime.negative{ background: rgba(229,72,77,0.15); color: var(--up); }
  .leader-empty{ font-size:12px; color: var(--text-dim); padding:12px 0; }

  .detail{ background: var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px; margin-top:16px; }
  .detail-head{ display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px;}
  .detail-head h2{ font-size:22px; font-family:'JetBrains Mono',monospace; }
  .detail-head .spot-big{ font-size:26px; font-family:'JetBrains Mono',monospace; color: var(--gold);}

  .kpi-grid{ display:grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin: 16px 0;}
  .kpi{ background: var(--panel-2); border:1px solid var(--line); border-radius:6px; padding:10px 12px;}
  .kpi .label{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em;}
  .kpi .value{ font-family:'JetBrains Mono',monospace; font-size:18px; margin-top:4px;}
  .kpi.callwall .value{ color: var(--up); }
  .kpi.putwall .value{ color: var(--down); }
  .kpi.flip .value{ color: var(--gold); }

  canvas{ width:100%; height:260px; display:block; background: var(--panel-2); border-radius:6px; border:1px solid var(--line); }
  .legend{ display:flex; gap:16px; margin-top:10px; font-size:11px; color:var(--text-dim); }
  .legend .sw{ display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:middle;}

  .note{ font-size:12px; color: var(--text-dim); margin-top:14px; line-height:1.6; border-top:1px solid var(--line); padding-top:12px;}

  footer{ text-align:center; color: var(--text-dim); font-size:11px; padding: 30px 20px; }

  @media (max-width: 560px){
    header{ flex-direction:column; align-items:stretch; }
    .searchbar{ max-width:none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="dot"></div>
    <b>옵션보드</b>
    <span>Max Pain · GEX Terminal</span>
  </div>
  <div class="searchbar">
    <input id="tickerInput" class="mono" placeholder="티커 입력 (예: AAPL, NET, SNDK)" autocomplete="off">
    <button id="searchBtn">조회</button>
  </div>
</header>

<main>
  <div class="section-title">오늘의 주도주 · 웨이브 로테이션 기준</div>
  <div class="updated-note" id="leadersUpdatedNote">불러오는 중...</div>
  <div class="leaders-grid">
    <div class="leader-col">
      <div class="leader-col-header wave1">Wave 1 · 리더</div>
      <div class="leader-col-desc">신고가 갱신 중인 시장 주도주</div>
      <div id="wave1-list"><div class="leader-empty">불러오는 중...</div></div>
    </div>
    <div class="leader-col">
      <div class="leader-col-header wave2">Wave 2 · 로테이션 후보</div>
      <div class="leader-col-desc">반도체/메모리 장비군</div>
      <div id="wave2-list"><div class="leader-empty">불러오는 중...</div></div>
    </div>
    <div class="leader-col">
      <div class="leader-col-header speculative">관심 관찰</div>
      <div class="leader-col-desc">초기 모멘텀, 아직 미확인</div>
      <div id="speculative-list"><div class="leader-empty">불러오는 중...</div></div>
    </div>
  </div>

  <div class="section-title">관심종목 · 매일 자동 갱신</div>
  <div class="updated-note" id="updatedNote">불러오는 중...</div>
  <div id="watchlistGrid" class="watchlist-grid"></div>

  <div id="detailSection" style="display:none;">
    <div class="section-title">상세 분석</div>
    <div class="detail" id="detail"></div>
  </div>
</main>

<footer>
  데이터 출처: Massive.com (15분 지연) · 본 페이지는 정보 제공 목적이며 투자 자문이 아닙니다. Max Pain/GEX는 참고 지표이며 매매 추천이 아닙니다.
</footer>

<script>
const UP = '#e5484d';
const DOWN = '#3d7fe0';
const GOLD = '#e0a838';

function fmtNum(n, digits=2){
  if(n===null || n===undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('en-US', {maximumFractionDigits:digits});
}

function fmtCompact(n){
  if(n===null || n===undefined || isNaN(n)) return '—';
  const abs = Math.abs(n);
  if(abs >= 1e9) return (n/1e9).toFixed(2)+'B';
  if(abs >= 1e6) return (n/1e6).toFixed(2)+'M';
  if(abs >= 1e3) return (n/1e3).toFixed(1)+'K';
  return n.toFixed(0);
}

function leaderCardHTML(item){
  const near = item.call_wall_distance_pct !== null && item.call_wall_distance_pct !== undefined && item.call_wall_distance_pct <= 2;
  const distanceText = (item.call_wall_distance_pct !== null && item.call_wall_distance_pct !== undefined)
    ? `Call Wall +${item.call_wall_distance_pct}%`
    : '—';
  const regimeHtml = item.gamma_regime
    ? `<span class="badge-regime ${item.gamma_regime}">${item.gamma_regime === 'positive' ? '양감마' : '음감마'}</span>`
    : '';

  return `
    <div class="leader-card" data-ticker="${item.ticker}">
      <div>
        <div class="leader-ticker">${item.ticker}</div>
        <div class="leader-sector">${item.sector || ''}</div>
      </div>
      <div class="leader-badge">
        <div class="badge-distance ${near ? 'near' : ''}">${distanceText}</div>
        ${regimeHtml}
      </div>
    </div>
  `;
}

function renderLeaderColumn(containerId, items){
  const el = document.getElementById(containerId);
  if(!items || items.length === 0){
    el.innerHTML = '<div class="leader-empty">아직 등록된 종목이 없습니다</div>';
    return;
  }
  el.innerHTML = items.map(leaderCardHTML).join('');
  el.querySelectorAll('.leader-card').forEach(card=>{
    card.addEventListener('click', ()=> searchTicker(card.dataset.ticker));
  });
}

async function loadLeaders(){
  const note = document.getElementById('leadersUpdatedNote');
  try{
    const res = await fetch('/leaders_report.json', {cache:'no-store'});
    if(!res.ok) throw new Error('리포트 없음');
    const data = await res.json();
    const dt = new Date(data.generated_at);
    note.textContent = `마지막 갱신: ${dt.toLocaleString('ko-KR')} (매 거래일 자동 갱신)`;

    const cats = data.categories || {};
    renderLeaderColumn('wave1-list', cats.wave1);
    renderLeaderColumn('wave2-list', cats.wave2);
    renderLeaderColumn('speculative-list', cats.speculative);
  }catch(e){
    note.textContent = '';
    ['wave1-list','wave2-list','speculative-list'].forEach(id=>{
      document.getElementById(id).innerHTML = '<div class="leader-empty">아직 데이터가 없습니다 (첫 자동 갱신 대기 중)</div>';
    });
  }
}

async function loadWatchlist(){
  const grid = document.getElementById('watchlistGrid');
  const note = document.getElementById('updatedNote');
  try{
    const res = await fetch('/watchlist_report.json', {cache:'no-store'});
    if(!res.ok) throw new Error('리포트 없음');
    const data = await res.json();
    const dt = new Date(data.generated_at);
    note.textContent = `마지막 갱신: ${dt.toLocaleString('ko-KR')} (매 거래일 장마감 후 자동 갱신)`;

    if(!data.tickers || data.tickers.length === 0){
      grid.innerHTML = '<div class="empty">아직 생성된 리포트가 없습니다. GitHub Actions가 처음 실행되면 표시됩니다.</div>';
      return;
    }

    grid.innerHTML = data.tickers.map(t => cardHTML(t)).join('');
    grid.querySelectorAll('.wcard').forEach(el=>{
      el.addEventListener('click', ()=> searchTicker(el.dataset.ticker));
    });
  }catch(e){
    note.textContent = '';
    grid.innerHTML = '<div class="empty">관심종목 리포트를 아직 불러올 수 없습니다. (첫 배포 직후이거나 GitHub Actions 실행 전일 수 있어요)</div>';
  }
}

function cardHTML(t){
  const regimePos = t.regime === 'positive';
  return `
  <div class="wcard" data-ticker="${t.ticker}">
    <div class="t">${t.ticker}</div>
    <div class="spot mono">$${fmtNum(t.spot)}</div>
    <div class="rows">
      <div class="r"><span>Max Pain</span><b>${fmtNum(t.max_pain,1)}</b></div>
      <div class="r"><span>Call Wall</span><b style="color:${UP}">${fmtNum(t.call_wall,1)}</b></div>
      <div class="r"><span>Put Wall</span><b style="color:${DOWN}">${fmtNum(t.put_wall,1)}</b></div>
      <div class="r"><span>Gamma Flip</span><b style="color:${GOLD}">${fmtNum(t.gamma_flip,1)}</b></div>
    </div>
    <div class="badge ${regimePos?'pos':'neg'}">${regimePos?'POSITIVE GAMMA':'NEGATIVE GAMMA'}</div>
  </div>`;
}

async function searchTicker(ticker){
  const input = document.getElementById('tickerInput');
  const btn = document.getElementById('searchBtn');
  const section = document.getElementById('detailSection');
  const detail = document.getElementById('detail');

  ticker = (ticker || input.value).trim().toUpperCase();
  if(!ticker) return;
  input.value = ticker;

  section.style.display = 'block';
  detail.innerHTML = `<div class="empty">${ticker} 옵션체인 계산 중...</div>`;
  section.scrollIntoView({behavior:'smooth', block:'start'});
  btn.disabled = true;

  try{
    const res = await fetch(`/api/search?ticker=${encodeURIComponent(ticker)}`);
    const data = await res.json();
    if(data.error){
      detail.innerHTML = `<div class="empty">오류: ${data.error}</div>`;
      return;
    }
    renderDetail(data);
  }catch(e){
    detail.innerHTML = `<div class="empty">요청 실패: ${e.message}</div>`;
  }finally{
    btn.disabled = false;
  }
}

function renderDetail(d){
  const detail = document.getElementById('detail');
  const regimePos = d.regime === 'positive';

  detail.innerHTML = `
    <div class="detail-head">
      <h2>${d.ticker}</h2>
      <div class="spot-big">$${fmtNum(d.spot)}</div>
    </div>
    <div style="color:var(--text-dim); font-size:12px; margin-top:4px;">
      만기 ${d.expiry_used} 기준 Max Pain · 근접 만기 ${d.expiries_included_in_gex.length}개 합산 GEX
    </div>

    <div class="kpi-grid">
      <div class="kpi"><div class="label">Max Pain</div><div class="value">${fmtNum(d.max_pain,1)}</div></div>
      <div class="kpi callwall"><div class="label">Call Wall (저항)</div><div class="value">${fmtNum(d.call_wall,1)}</div></div>
      <div class="kpi putwall"><div class="label">Put Wall (지지)</div><div class="value">${fmtNum(d.put_wall,1)}</div></div>
      <div class="kpi flip"><div class="label">Gamma Flip</div><div class="value">${fmtNum(d.gamma_flip,1)}</div></div>
      <div class="kpi"><div class="label">Net GEX</div><div class="value" style="color:${regimePos?UP:DOWN}">${fmtCompact(d.net_gex_total)}</div></div>
      <div class="kpi"><div class="label">체제</div><div class="value" style="color:${regimePos?UP:DOWN}">${regimePos?'양의 감마':'음의 감마'}</div></div>
    </div>

    <canvas id="gexCanvas"></canvas>
    <div class="legend">
      <span><span class="sw" style="background:${UP}"></span>Call GEX</span>
      <span><span class="sw" style="background:${DOWN}"></span>Put GEX</span>
      <span><span class="sw" style="background:${GOLD}"></span>현재가</span>
    </div>

    <div class="note">
      ${(d.narrative || []).map(line => `<p style="margin:0 0 8px;">${line}</p>`).join('')}
      <p style="margin:12px 0 0; color:var(--text-dim); font-size:11px;">
        ⚠️ 위 해설은 옵션 데이터를 기계적으로 해석한 참고 정보이며, 매수/매도를 권유하는 투자자문이 아닙니다.
        Massive.com(15분 지연) 데이터 기반이라 실제 매매 전 재확인을 권장합니다.
      </p>
    </div>
  `;

  drawGexChart(d);
}

function drawGexChart(d){
  const canvas = document.getElementById('gexCanvas');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = 260 * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const W = rect.width, H = 260;
  ctx.clearRect(0,0,W,H);

  const rows = d.gex_by_strike || [];
  if(rows.length === 0){
    ctx.fillStyle = '#8b93a1';
    ctx.font = '12px monospace';
    ctx.fillText('표시할 GEX 데이터가 없습니다', 12, H/2);
    return;
  }

  const spot = d.spot;
  const filtered = rows.filter(r => r.strike > spot*0.75 && r.strike < spot*1.25);
  const use = filtered.length >= 6 ? filtered : rows;

  const maxAbs = Math.max(1, ...use.map(r => Math.max(Math.abs(r.call_gex), Math.abs(r.put_gex))));
  const padding = {top:14, bottom:26, left:8, right:8};
  const plotH = H - padding.top - padding.bottom;
  const zeroY = padding.top + plotH/2;
  const barW = Math.max(2, (W - padding.left - padding.right)/use.length - 3);

  use.forEach((r,i)=>{
    const x = padding.left + i*((W-padding.left-padding.right)/use.length);
    const callH = (r.call_gex/maxAbs) * (plotH/2);
    const putH = (Math.abs(r.put_gex)/maxAbs) * (plotH/2);

    ctx.fillStyle = UP;
    ctx.fillRect(x, zeroY-Math.max(callH,0), barW, Math.max(callH,0));

    ctx.fillStyle = DOWN;
    ctx.fillRect(x, zeroY, barW, Math.max(putH,0));
  });

  ctx.strokeStyle = '#2a3140';
  ctx.beginPath(); ctx.moveTo(0,zeroY); ctx.lineTo(W,zeroY); ctx.stroke();

  const minK = use[0].strike, maxK = use[use.length-1].strike;
  const spotX = padding.left + ((spot-minK)/(maxK-minK || 1)) * (W-padding.left-padding.right);
  ctx.strokeStyle = GOLD;
  ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(spotX,0); ctx.lineTo(spotX,H-padding.bottom); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#8b93a1';
  ctx.font = '10px monospace';
  const step = Math.ceil(use.length/6);
  use.forEach((r,i)=>{
    if(i % step !== 0) return;
    const x = padding.left + i*((W-padding.left-padding.right)/use.length);
    ctx.fillText(r.strike.toFixed(0), x, H-8);
  });
}

document.getElementById('searchBtn').addEventListener('click', ()=>searchTicker());
document.getElementById('tickerInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') searchTicker();
});

loadLeaders();
loadWatchlist();
</script>

</body>
</html>
