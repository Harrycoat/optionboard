<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SORA CORE 관리자 가상매수</title><style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#f4f7f8;color:#1d3440;margin:0}main{max-width:640px;margin:35px auto;padding:18px}section{background:white;border:1px solid #d7e3e6;border-radius:14px;padding:22px}label{display:block;font-weight:700;margin:16px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #b9ccd2;border-radius:8px;font:inherit}button{border:0;border-radius:9px;background:#08785c;color:white;padding:14px 19px;font:inherit;font-weight:700;cursor:pointer;margin-top:16px}button:disabled{opacity:.55}.notice{background:#fff4d9;padding:12px;border-radius:9px}.result{white-space:pre-wrap;background:#edf3f5;padding:12px;border-radius:8px;min-height:55px}a{color:#08785c}small{color:#566b76}</style></head><body><main><p><a href="/portfolio-hub.html">← 30개 계좌 보기</a></p><section><h1>관리자 CORE 가상매수</h1><p class="notice"><b>가상매매 전용.</b> 실제 증권 주문은 발생하지 않습니다. 현재는 <b>SORA 01</b> 한 계좌로만 시험합니다. 관리자 인증 및 저장소 설정 전에는 저장되지 않습니다.</p><form id="form"><label for="ticker">종목</label><select id="ticker" required><option>NVDA</option><option>AMZN</option><option>PLTR</option></select><label for="stage">매수 차수</label><select id="stage" required><option value="20MA_FIRST">1차 · 일봉 20일선</option><option value="50MA_SECOND">2차 · 일봉 50일선</option><option value="MANUAL_OTHER">기타 · 관리자 판단</option></select><label for="price">가상 체결가 ($) · 관리자 입력</label><input id="price" type="number" min=".0001" step=".0001" placeholder="실제 확인한 가격만 입력" required><label for="qty">수량 (주)</label><input id="qty" type="number" min="1" step="1" required><label for="reason">매수 근거</label><textarea id="reason" maxlength="300" rows="3" required placeholder="예: 일봉 20MA 눌림 + 30분봉 Smooth 전환 확인"></textarea><p><small>관리자가 입력한 가격은 시장 검증 시세가 아니라 수동 가상체결 가격입니다. 저장 시각은 서버 UTC입니다.</small></p><button id="save" type="submit">CORE 가상매수 기록 저장</button></form><h2>처리 결과</h2><div class="result" id="result" role="status">매수 내역이 없습니다.</div><button id="refresh" type="button">저장된 가상매수 확인</button></section></main><script>
const form=document.getElementById("form"),result=document.getElementById("result"),save=document.getElementById("save");
function show(v){result.textContent=typeof v==="string"?v:JSON.stringify(v,null,2)}
let requestId=null;
form.addEventListener("input",()=>requestId=null);
form.addEventListener("submit",async ev=>{ev.preventDefault();if(save.disabled)return;save.disabled=true;show("서버 저장 결과 확인 중…");try{
if(!requestId)requestId="core-"+crypto.randomUUID();
const body={account_id:"SORA-01",ticker:document.getElementById("ticker").value,entry_stage:document.getElementById("stage").value,fill_price:Number(document.getElementById("price").value),quantity:Number(document.getElementById("qty").value),reason:document.getElementById("reason").value,request_id:requestId};
const r=await fetch("/api/sora_admin_paper_buy",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify(body),cache:"no-store"});
const data=await r.json().catch(()=>({error:"INVALID_RESPONSE"}));
show(r.ok?data:{error:"저장 실패",http:r.status,detail:data});
if(r.ok){requestId=null;form.reset()}
}catch(e){show("저장 확인 불가. 거래장부를 다시 조회한 뒤 재시도하세요: "+e.message)}finally{save.disabled=false}});
document.getElementById("refresh").onclick=async()=>{try{const r=await fetch("/api/sora_admin_paper_buy",{credentials:"same-origin",cache:"no-store"});show(r.ok?await r.json():"조회 실패 HTTP "+r.status)}catch(e){show("조회 실패: "+e.message)}};
</script></body></html>
